<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="rbt-page-banner-wrapper">
        <div class="rbt-banner-image"></div>
    </div>

    <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="rbt-dashboard-content-wrapper">
                        <div class="tutor-bg-photo height-350" 
                            style="background-image: url('/admin-assets/images/background/background-student.jpg'); background-size: cover; background-position: center;">
                        </div>
                        <div class="rbt-tutor-information">
                            <div class="rbt-tutor-information-left">
                                <div class="thumbnail rbt-avatars size-lg">
                                    <img th:src="${user.image != null && !#strings.isEmpty(user.image) ? '/assets/images/users/' + user.image : '/assets/images/team/user-icon.png'}" alt="Avatar" />
                                </div>
                                <div class="tutor-content">
                                    <h5 class="title" th:text="${user.fullname}"></h5>
                                    <ul class="rbt-meta rbt-meta-white mt--5">
                                        <li><i class="feather-book"></i>5 Courses Enroled</li>
                                        <li><i class="feather-award"></i>4 Certificate</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="rbt-tutor-information-right">
                                <div class="tutor-btn">
                                    <a class="rbt-btn btn-md hover-icon-reverse" href="#">
                                        <span class="icon-reverse-wrapper">
                                            <span class="btn-text">Become an Instructor</span>
                                            <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                            <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                        </span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-5">
                        <div class="col-lg-3">
                            <div th:replace="~{client/student/studentSidebar :: student-sidebar}"></div>
                        </div>
                        <div class="col-lg-9">
                            <div class="rbt-dashboard-content bg-color-white rbt-shadow-box">
                                <div class="content">
                                    <div class="section-title mb--20">
                                        <h4 class="rbt-title-style-3">Đổi mật khẩu</h4>
                                    </div>
                                    <!-- Thông báo lỗi/thành công -->
                                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                                    <form th:action="@{/student/change-password}" method="post">
                                        <div class="form-group mb-4">
                                            <label class="form-label fw-semibold mb-2">Mật khẩu hiện tại</label>
                                            <input type="password" class="form-control" name="currentPassword"  required>
                                        </div>
                                        <div class="form-group mb-4">
                                            <label class="form-label fw-semibold mb-2">Mật khẩu mới</label>
                                            <input type="password" class="form-control" name="newPassword" required>
                                        </div>
                                        <div class="form-group mb-4">
                                            <label class="form-label fw-semibold mb-2">Nhập lại mật khẩu mới</label>
                                            <input type="password" class="form-control" name="confirmPassword"  required>
                                        </div>
                                        <button type="submit" class="rbt-btn btn-md">Cập nhật mật khẩu</button>
                                    </form>

                                </div>
                            </div>
                        </div> <!-- col-lg-9 -->
                    </div> <!-- row -->
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
