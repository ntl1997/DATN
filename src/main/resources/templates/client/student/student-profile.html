<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="rbt-page-banner-wrapper">
            <!-- Start Banner BG Image  -->
            <div class="rbt-banner-image"></div>
            <!-- End Banner BG Image  -->
        </div>

        <!-- Start Card Style -->
        <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Start Dashboard Top  -->
                        <div class="rbt-dashboard-content-wrapper">
                            <div class="tutor-bg-photo height-350"
                                style="background-image: url('/assets/images/bg/background-student.jpg'); background-size: cover; background-position: center;">
                            </div>
                            <!-- Start Tutor Information  -->
                            <div class="rbt-tutor-information">
                                <div class="rbt-tutor-information-left">
                                    <div class="thumbnail rbt-avatars size-lg">
                                        <img th:src="${user.image != null && !#strings.isEmpty(user.image) ? '/uploads/users/' + user.image : '/assets/images/team/user-icon.png'}"
                                            alt="Avatar" />
                                    </div>
                                    <div class="tutor-content">
                                        <h5 class="title" th:text="${user.fullname}"></h5>
                                        <ul class="rbt-meta rbt-meta-white mt--5">
                                            <li><i class="feather-book"></i>5 Courses Enroled</li>
                                            <li><i class="feather-award"></i>4 Certificate</li>
                                        </ul>
                                    </div>
                                </div>
                                <div class="rbt-tutor-information-right">
                                    <div class="tutor-btn">
                                        <a class="rbt-btn btn-md hover-icon-reverse" href="#">
                                            <span class="icon-reverse-wrapper">
                                                <span class="btn-text">Become an Instructor</span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                            </span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <!-- End Tutor Information  -->
                        </div>
                        <!-- End Dashboard Top  -->

                        <div class="row g-5">
                            <div class="col-lg-3">
                                <!-- Dashboard Sidebar -->
                                <div th:replace="~{client/student/studentSidebar :: student-sidebar}"></div>
                            </div>
                            <div class="col-lg-9">
                                <!-- Start Instructor Profile  -->
                                <div class="rbt-dashboard-content bg-color-white rbt-shadow-box">
                                    <div class="content">
                                        <div class="section-title">
                                            <h4 class="rbt-title-style-3">Thông tin cá nhân</h4>
                                        </div>
                                        <!-- Start Profile Row  -->
                                        <div class="rbt-profile-row row row--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Ngày đăng ký</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2"
                                                    th:text="${#dates.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">
                                                </div>
                                            </div>
                                        </div>
                                        <!-- End Profile Row  -->

                                        <div class="rbt-profile-row row row--15 mt--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Họ tên</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2" th:text="${user.fullname}"></div>
                                            </div>
                                        </div>

                                        <div class="rbt-profile-row row row--15 mt--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Email</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2" th:text="${user.email}"></div>
                                            </div>
                                        </div>

                                        <div class="rbt-profile-row row row--15 mt--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Số điện thoại</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2" th:text="${user.phoneNumber}"></div>
                                            </div>
                                        </div>

                                        <div class="rbt-profile-row row row--15 mt--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Nghề nghiệp/Kỹ năng</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2" th:text="${user.occupation}"></div>
                                            </div>
                                        </div>

                                        <div class="rbt-profile-row row row--15 mt--15">
                                            <div class="col-lg-4 col-md-4">
                                                <div class="rbt-profile-content b2">Tiểu sử</div>
                                            </div>
                                            <div class="col-lg-8 col-md-8">
                                                <div class="rbt-profile-content b2" th:text="${user.biography}"></div>
                                            </div>
                                        </div>
                                        <!-- End Profile Row  -->
                                    </div>
                                </div>
                                <!-- End Instructor Profile  -->
                                <!-- Start Action Buttons -->
                                <div class="rbt-profile-row row row--15 mt--30">
                                    <div class="col-lg-12">
                                        <div class="rbt-button-group">
                                            <a class="rbt-btn btn-md hover-icon-reverse"
                                                th:href="@{/student/profile/edit}">
                                                <span class="icon-reverse-wrapper">
                                                    <span class="btn-text">Chỉnh sửa thông tin</span>
                                                    <span class="btn-icon"><i class="feather-edit"></i></span>
                                                    <span class="btn-icon"><i class="feather-edit"></i></span>
                                                </span>
                                            </a>
                                            <a class="rbt-btn btn-md hover-icon-reverse"
                                                th:href="@{/student/change-password}">
                                                <span class="icon-reverse-wrapper">
                                                    <span class="btn-text">Đổi mật khẩu</span>
                                                    <span class="btn-icon"><i class="feather-lock"></i></span>
                                                    <span class="btn-icon"><i class="feather-lock"></i></span>
                                                </span>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <!-- End Action Buttons -->

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
        <!-- End Card Style -->
    </div>
</body>

</html>
