<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="rbt-page-banner-wrapper">
            <!-- Start Banner BG Image  -->
            <div class="rbt-banner-image"></div>
            <!-- End Banner BG Image  -->
        </div>

        <!-- Start Card Style -->
        <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Start Dashboard Top  -->
                        <div th:replace="~{client/student/student-banner :: student-banner}"></div>
                        <!-- End Dashboard Top  -->

                        <div class="row g-5">
                            <div class="col-lg-3">
                                <!-- Dashboard Sidebar -->
                                <div th:replace="~{client/student/studentSidebar :: student-sidebar}"></div>
                            </div>
                            <div class="col-lg-9">
                                <div th:if="${#lists.isEmpty(wishlist)}">
                                    <p>Bạn chưa có khóa học yêu thích nào.</p>
                                </div>
                                <div class="col-lg-4 col-md-6 col-12" th:each="item : ${wishlist}">
                                    <div class="rbt-card variation-01 rbt-hover">
                                        <div class="rbt-card-img">
                                            <a th:href="@{|/course-details/${item.course.courseId}|}">
                                                <img th:src="@{${item.course.courseImage}}" alt="Card image">
                                            </a>
                                        </div>
                                        <div class="rbt-card-body">
                                            <div class="rbt-card-top">
                                                <div class="rbt-review">
                                                    <div class="rating">
                                                        <i class="fas fa-star"></i>
                                                        <i class="fas fa-star"></i>
                                                        <i class="fas fa-star"></i>
                                                        <i class="fas fa-star"></i>
                                                        <i class="fas fa-star"></i>
                                                    </div>
                                                    <!-- Có thể hiển thị số review nếu muốn -->
                                                </div>
                                                <div class="rbt-bookmark-btn">
                                                    <a class="rbt-round-btn" title="Bookmark" href="#"><i class="feather-bookmark"></i></a>
                                                </div>
                                            </div>
                                            <h4 class="rbt-card-title">
                                                <a th:href="@{|/detail/${item.course.courseId}|}" th:text="${item.course.title}"></a>
                                            </h4>
                                            <ul class="rbt-meta">
                                                <li><i class="feather-book">20 Lessons</i> <!-- lessons --> </li>
                                                <li><i class="feather-users">100 Students</i> <!-- students --> </li>
                                            </ul>
                                            <div class="rbt-card-bottom">
                                                <div class="rbt-price">
                                                    <span class="current-price" th:text="${#numbers.formatDecimal(item.course.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                                                    <span class="off-price" th:if="${item.course.discount > 0}" th:text="${#numbers.formatDecimal(item.course.price + item.course.discount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                                                </div>
                                                <a class="rbt-btn-link" th:href="@{|/detail/${item.course.courseId}|}">Xem chi tiết<i class="feather-arrow-right"></i></a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- End Card Style -->
    </div>
</body>

</html>
