<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chứng chỉ khoá học</title>

    <th:block th:fragment="styles">
      <style>
        body {
          background-color: #f5f5f5;
        }

        .certificate-wrapper {
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 0;
          margin: 0;
        }

        .certificate-frame {
          position: relative;
          width: 988px;
          height: 768px;
          border-radius: 15px;
          overflow: hidden;
          background-color: #000;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .certificate-frame img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .certificate-title {
          position: absolute;
          top: 145px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 26px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          white-space: nowrap;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
          z-index: 1;
        }

        .certificate-name {
          position: absolute;
          top: 230px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 24px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          white-space: nowrap;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
          z-index: 1;
        }

        .certificate-year {
          position: absolute;
          top: 330px;
          left: 818px;
          font-size: 18px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          white-space: nowrap;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
          z-index: 1;
        }

        .btn-back {
          margin-top: 30px;
          text-align: center;
        }
      </style>
    </th:block>
  </head>

  <body>
    <div th:fragment="content">
      <div class="certificate-wrapper">
        <div class="certificate-frame">
          <img src="/assets/images/others/background-certificate.png" alt="Certificate Background" />

          <!-- Các dòng text đè lên ảnh -->
          <div class="certificate-title" th:text="${certificate.course.title}">Khóa học Lập trình Python</div>
          <div class="certificate-name" th:text="${certificate.user.fullname}">Jane Student</div>
          <div class="certificate-year" th:text="${#dates.format(certificate.issuedAt, 'yyyy')}">2025</div>
        </div>
      </div>

      <div class="btn-back">
        <a th:href="@{/student/student-certificate}" class="btn btn-secondary">← Quay lại danh sách</a>
      </div>
    </div>
  </body>
</html>
