<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chứng chỉ khoá học</title>

    <!-- ✅ Fragment chứa CSS sẽ được nhúng vào layout/index.html -->
    <th:block th:fragment="styles">
      <style>
        .certificate-wrapper {
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 30px 0;
        }

        .certificate-frame {
          position: relative;
          width: 988px;
          height: 768px;
          border-radius: 15px;
          overflow: hidden;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
          background-color: #000;
        }

        .certificate-frame img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .certificate-title {
          position: absolute;
          top: 165px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 28px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
          white-space: nowrap;
          z-index: 1;
        }

        .certificate-name {
          position: absolute;
          top: 255px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 26px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
          white-space: nowrap;
          z-index: 1;
        }

        .certificate-year {
          position: absolute;
          top: 342px;
          left: 807px;
          font-size: 20px;
          font-weight: bold;
          color: #ffffff;
          font-family: "Georgia", serif;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
          white-space: nowrap;
          z-index: 1;
        }
      </style>
    </th:block>
  </head>

  <body>
    <div th:fragment="content">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-12">
            <div class="card shadow-sm">
              <div class="card-body text-center">
                <div th:if="${certificate != null}">
                  <!-- Khung chứng chỉ -->
                  <div class="certificate-wrapper">
                    <div class="certificate-frame">
                      <img src="/assets/images/others/background-certificate.png" alt="Certificate Background" />

                      <!-- Nội dung đè trên ảnh -->
                      <div class="certificate-title" th:text="${certificate.course.title}">Tên chứng chỉ</div>
                      <div class="certificate-name" th:text="${certificate.user.fullname}">Tên người đạt</div>
                      <div class="certificate-year" th:text="${#dates.format(certificate.issuedAt, 'yyyy')}">2025</div>
                    </div>
                  </div>
                </div>

                <div th:unless="${certificate != null}">
                  <p class="text-danger">Không tìm thấy chứng chỉ.</p>
                </div>

                <a th:href="@{/student/student-certificate}" class="btn btn-secondary mt-4 d-block">
                  ← Quay lại danh sách
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
