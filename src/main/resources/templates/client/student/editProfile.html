<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="rbt-page-banner-wrapper">
            <div class="rbt-banner-image"></div>
        </div>

        <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Start Dashboard Top  -->
                        <div class="rbt-dashboard-content-wrapper">
                            <div class="tutor-bg-photo height-350"
                                style="background-image: url('/admin-assets/images/background/background-student.jpg'); background-size: cover; background-position: center;">
                            </div>
                            <!-- Start Tutor Information  -->
                            <div class="rbt-tutor-information">
                                <div class="rbt-tutor-information-left">
                                    <div class="thumbnail rbt-avatars size-lg">
                                        <img th:src="${user.image != null && !#strings.isEmpty(user.image) ? '/uploads/users/' + user.image : '/assets/images/team/user-icon.png'}"
                                            alt="Avatar" />
                                    </div>
                                    <div class="tutor-content">
                                        <h5 class="title" th:text="${user.fullname}"></h5>
                                        <ul class="rbt-meta rbt-meta-white mt--5">
                                            <li><i class="feather-book"></i>5 Courses Enroled</li>
                                            <li><i class="feather-award"></i>4 Certificate</li>
                                        </ul>
                                    </div>
                                </div>
                                <div class="rbt-tutor-information-right">
                                    <div class="tutor-btn">
                                        <a class="rbt-btn btn-md hover-icon-reverse" href="#">
                                            <span class="icon-reverse-wrapper">
                                                <span class="btn-text">Become an Instructor</span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                            </span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <!-- End Tutor Information  -->
                        </div>
                        <!-- End Dashboard Top  -->

                        <div class="row g-5">
                            <div class="col-lg-3">
                                <div th:replace="~{client/student/studentSidebar :: student-sidebar}"></div>
                            </div>
                            <div class="col-lg-9">
                                <div class="rbt-dashboard-content bg-color-white rbt-shadow-box">
                                    <div class="content">
                                        <div class="section-title mb--20">
                                            <h4 class="rbt-title-style-3">Chỉnh sửa thông tin cá nhân</h4>
                                        </div>
                                        <form th:action="@{/student/profile/update}" method="post" th:object="${user}"
                                            enctype="multipart/form-data">
                                            <div class="form-group mb-4 text-center">
                                                <label for="image" class="form-label fw-semibold mb-2">Ảnh đại
                                                    diện</label><br>
                                                <img th:src="${user.image != null && !#strings.isEmpty(user.image) ? '/uploads/users/' + user.image : '/assets/images/team/user-icon.png'}"
                                                    alt="Avatar"
                                                    style="width:90px; height:90px; object-fit:cover; border-radius:50%; border:2px solid #eee; margin-bottom:10px;" />
                                                <input type="file" id="image" name="imageFile" class="form-control mt-2"
                                                    accept="image/*">
                                            </div>
                                            <div class="form-group mb-4">
                                                <input type="text" id="fullname" class="form-control"
                                                    th:field="*{fullname}" placeholder="Họ tên">
                                            </div>
                                            <div class="form-group mb-4">
                                                <input type="email" id="email" class="form-control" th:field="*{email}"
                                                    placeholder="Email">
                                            </div>
                                            <div class="form-group mb-4">
                                                <input type="text" id="phoneNumber" class="form-control"
                                                    th:field="*{phoneNumber}" placeholder="Số điện thoại">
                                            </div>
                                            <div class="form-group mb-4">
                                                <input type="text" id="occupation" class="form-control"
                                                    th:field="*{occupation}" placeholder="Nghề nghiệp/Kỹ năng">
                                            </div>
                                            <div class="form-group mb-4">
                                                <textarea id="biography" class="form-control" rows="4"
                                                    th:field="*{biography}" placeholder="Tiểu sử"></textarea>
                                            </div>
                                            <button type="submit" class="rbt-btn btn-md mt-3">Lưu thay đổi</button>
                                        </form>

                                    </div>
                                </div>
                            </div> <!-- col-lg-9 -->
                        </div> <!-- row -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
