<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body class="rbt-header-sticky">
    <div th:fragment="content">
      <div class="rbt-lesson-area bg-color-white">
        <div class="rbt-lesson-content-wrapper">
          <div th:replace="~{client/learning/learning-sidebar :: learning-sidebar}"></div>

          <div class="rbt-lesson-rightsidebar overflow-hidden lesson-video">
            <div class="lesson-top-bar">
              <div class="lesson-top-left">
                <div class="rbt-lesson-toggle">
                  <button class="lesson-toggle-active btn-round-white-opacity" title="Toggle Sidebar">
                    <i class="feather-arrow-left"></i>
                  </button>
                </div>
                <h5>Trọn bộ Vietstudy 2025: Hành trình từ con số 0 đến chuyên gia!</h5>
              </div>
              <div class="lesson-top-right">
                <div class="rbt-btn-close">
                  <a
                    th:href="@{/course-details/{id}(id=${course.courseId})}"
                    title="Go Back to Course"
                    class="rbt-round-btn"
                    ><i class="feather-x"></i
                  ></a>
                </div>
              </div>
            </div>

            <div class="inner">
              <div class="plyr__video-embed rbtplayer">
                <iframe
                  id="lecturePlayer"
                  width="100%"
                  height="500"
                  src=""
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                ></iframe>
              </div>
              <div class="content">
                <div class="section-title">
                  <h4>Về bài học</h4>
                  <p>
                    Hãy cùng nhau phân tích những bản hit vĩ đại nhất trong quá khứ và tìm hiểu điều gì khiến chúng trở
                    nên đặc biệt đến vậy.
                  </p>
                </div>
              </div>
            </div>

            <div class="bg-color-extra2 ptb--15 overflow-hidden">
              <div class="rbt-button-group">
                <a class="rbt-btn icon-hover icon-hover-left btn-md bg-primary-opacity" href="#">
                  <span class="btn-icon"><i class="feather-arrow-left"></i></span>
                  <span class="btn-text">Previous</span>
                </a>

                <a class="rbt-btn icon-hover btn-md" href="#">
                  <span class="btn-text">Next</span>
                  <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="rbt-progress-parent">
        <svg class="rbt-back-circle svg-inner" width="100%" height="100%" viewBox="-1 -1 102 102">
          <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
        </svg>
      </div>
    </div>
    <div th:fragment="scripts">
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const links = document.querySelectorAll("[data-video-url]");
          const player = document.getElementById("lecturePlayer");

          console.log("Iframe DOM: ", player); // THÊM DÒNG NÀY

          if (!player) {
            console.error("Không tìm thấy iframe #lecturePlayer");
            return;
          }

          links.forEach(function (link) {
            link.addEventListener("click", function (event) {
              event.preventDefault();
              const videoUrl = link.getAttribute("data-video-url");
              console.log("Đã click vào bài giảng:", videoUrl);
              player.setAttribute("src", videoUrl);
            });
          });
        });
      </script>
    </div>
  </body>
</html>
