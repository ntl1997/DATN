<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="assignment-model">
      <!-- Assignment Modal -->
      <div class="rbt-default-modal modal fade" id="create-assignment" tabindex="-1" aria-labelledby="AssignmentLabel">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="rbt-round-btn" data-bs-dismiss="modal" aria-label="Close">
                <i class="feather-x"></i>
              </button>
            </div>
            <div class="modal-body">
              <div class="inner rbt-default-form">
                <div class="row">
                  <div class="col-lg-12">
                    <form action="#">
                      <h5 class="modal-title mb--20" id="LessonLabel">Assignment</h5>
                      <div class="course-field mb--20">
                        <label for="modal-field-1">Assignment Title</label
                        ><input id="modal-field-1" type="text" placeholder="Assignments" />
                      </div>
                      <div class="course-field mb--30">
                        <label for="modal-field-3">Summary</label>
                        <textarea id="editor3"></textarea>
                      </div>
                      <div class="course-field mb--20">
                        <h6>Attachments</h6>
                        <div class="rbt-modern-select bg-transparent height-45 w-100 mb--10">
                          <button class="rbt-btn btn-md btn-border hover-icon-reverse">
                            <span class="icon-reverse-wrapper"
                              ><span class="btn-text">Upload Attachments</span
                              ><span class="btn-icon"><i class="feather-paperclip"></i></span
                              ><span class="btn-icon"><i class="feather-paperclip"></i></span
                            ></span></button
                          ><input type="file" style="display: none" />
                        </div>
                      </div>
                      <div class="course-field mb--15">
                        <label>Time Limit</label>
                        <div class="row row--15">
                          <div class="col-sm-6 col-lg-4">
                            <input class="shadow-none" type="number" placeholder="00" />
                          </div>
                          <div class="col-sm-5 col-lg-4">
                            <div class="rbt-modern-select bg-transparent height-45 w-75 mb--10">
                              <select class="w-100">
                                <option>Weaks</option>
                                <option>Day</option>
                                <option>Hour</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="course-field mb--15">
                        <label>Total Points</label>
                        <div class="row row--15">
                          <div class="col-lg-4">
                            <input class="shadow-none" type="number" placeholder="0" /><small
                              ><i class="feather-info pr--5"></i>Maximum points a student can score</small
                            >
                          </div>
                        </div>
                      </div>
                      <div class="course-field mb--15">
                        <label>Minimum Pass Points</label>
                        <div class="row row--15">
                          <div class="col-lg-4"><input class="shadow-none" type="number" placeholder="0" /></div>
                          <small
                            ><i class="feather-info pr--5"></i>Minimum points required for the student to pass this
                            assignment.</small
                          >
                        </div>
                      </div>
                      <div class="course-field mb--15">
                        <label>Allow to upload files</label>
                        <div class="row row--15">
                          <div class="col-lg-4"><input class="shadow-none" type="number" placeholder="0" /></div>
                          <small
                            ><i class="feather-info pr--5"></i>Define the number of files that a student can upload in
                            this assignment. Input 0 to disable the option to upload.</small
                          >
                        </div>
                      </div>
                      <div class="course-field mb--15">
                        <label>Maximum file size limit</label>
                        <div class="row row--15">
                          <div class="col-lg-4"><input class="shadow-none" type="number" placeholder="0" /></div>
                          <small><i class="feather-info pr--5"></i>Define maximum file size attachment in MB</small>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
            <div class="top-circle-shape"></div>
            <div class="modal-footer pt--30 justify-content-between">
              <button type="button" class="rbt-btn btn-border btn-md radius-round-10" data-bs-dismiss="modal">
                Cancel</button
              ><button type="button" class="rbt-btn btn-md">Save &amp; Next</button>
            </div>
          </div>
        </div>
      </div>
      <!-- Assignment Modal -->
    </div>
  </body>
</html>
