<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<body>
    <div th:fragment="content">

        <a class="close_side_menu" href="javascript:void(0);"></a>

        <div class="rbt-page-banner-wrapper">
            <!-- Start Banner BG Image  -->
            <div class="rbt-banner-image"></div>
            <!-- End Banner BG Image  -->
        </div>

        <!-- Start Card Style -->
        <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Start Dashboard Top  -->
                        <div class="rbt-dashboard-content-wrapper">
                            <div class="tutor-bg-photo bg_image bg_image--22 height-350"></div>
                            <!-- Start Tutor Information  -->
                            <div class="rbt-tutor-information">
                                <div class="rbt-tutor-information-left">
                                    <div class="thumbnail rbt-avatars size-lg">
                                        <img src="assets/images/team/avatar.jpg" alt="Instructor">
                                    </div>
                                    <div class="tutor-content">
                                        <h5 class="title" th:text="${name}"></h5>
                                        <div class="rbt-review">
                                            <div class="rating">
                                                <i class="fas fa-star"></i>
                                                <i class="fas fa-star"></i>
                                                <i class="fas fa-star"></i>
                                                <i class="fas fa-star"></i>
                                                <i class="fas fa-star"></i>
                                            </div>
                                            <span class="rating-count"> (15 Reviews)</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="rbt-tutor-information-right">
                                    <div class="tutor-btn">
                                        <a class="rbt-btn btn-md hover-icon-reverse"
                                            th:href="@{/instructor/create-course}">
                                            <span class="icon-reverse-wrapper">
                                                <span class="btn-text">Tạo khóa học mới</span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                                <span class="btn-icon"><i class="feather-arrow-right"></i></span>
                                            </span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <!-- End Tutor Information  -->
                        </div>
                        <!-- End Dashboard Top  -->

                        <div class="row g-5">
                            <div class="col-lg-3">
                                <!-- Start Dashboard Sidebar  -->
                                <div class="rbt-default-sidebar sticky-top rbt-shadow-box rbt-gradient-border">
                                    <div class="inner">
                                        <div class="content-item-content">

                                            <div class="rbt-default-sidebar-wrapper">
                                                <div class="section-title mb--20">
                                                    <h6 class="rbt-title-style-2">Chào mừng, <span
                                                            th:text="${name}"></span></h6>
                                                </div>
                                                <nav class="mainmenu-nav">
                                                    <ul class="dashboard-mainmenu rbt-default-sidebar-list">
                                                        <li><a th:href="@{/instructor/dashboard}"><i
                                                                    class="feather-home"></i><span>Bảng chung</span></a>
                                                        </li>
                                                        <li><a th:href="@{/instructor/profile}"><i
                                                                    class="feather-user"></i><span>Thông tin của
                                                                    tôi</span></a>
                                                        </li>
                                                        <li><a th:href="@{/instructor/reviews}"><i
                                                                    class="feather-star"></i><span>Reviews</span></a>
                                                        </li>
                                                        <li><a th:href="@{/instructor/order-history}"><i
                                                                    class="feather-shopping-bag"></i><span>Lịch sử đơn
                                                                    hàng</span></a></li>
                                                    </ul>
                                                </nav>

                                                <div class="section-title mt--40 mb--20">
                                                    <h6 class="rbt-title-style-2">Instructor</h6>
                                                </div>

                                                <nav class="mainmenu-nav">
                                                    <ul class="dashboard-mainmenu rbt-default-sidebar-list">
                                                        <li>
                                                            <a th:href="@{/instructor/courses}">
                                                                <i class="feather-monitor"></i><span>Khóa học của
                                                                    tôi</span>
                                                            </a>
                                                        </li>
                                                        <li>
                                                            <a th:href="@{/instructor/announcements}">
                                                                <i class="feather-volume-2"></i><span>Thông báo</span>
                                                            </a>
                                                        </li>
                                                    </ul>
                                                </nav>

                                                <div class="section-title mt--40 mb--20">
                                                    <h6 class="rbt-title-style-2">User</h6>
                                                </div>

                                                <nav class="mainmenu-nav">
                                                    <ul class="dashboard-mainmenu rbt-default-sidebar-list">
                                                        <li><a th:href="@{/instructor/settings}"><i
                                                                    class="feather-settings"></i><span>Settings</span></a>
                                                        </li>
                                                        <li><a href="index-2.html"><i
                                                                    class="feather-log-out"></i><span>Logout</span></a>
                                                        </li>
                                                    </ul>
                                                </nav>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                                <!-- End Dashboard Sidebar  -->
                            </div>

                            <div class="col-lg-9">
                                <!-- Start Instructor Profile  -->
                                <div class="rbt-dashboard-content bg-color-white rbt-shadow-box">
                                    <div class="content">

                                        <div class="section-title">
                                            <h4 class="rbt-title-style-3">Settings</h4>
                                        </div>

                                        <div class="advance-tab-button mb--30">
                                            <ul class="nav nav-tabs tab-button-style-2 justify-content-start"
                                                id="settinsTab-4" role="tablist">
                                                <li role="presentation">
                                                    <a href="#" class="tab-button active" id="profile-tab"
                                                        data-bs-toggle="tab" data-bs-target="#profile" role="tab"
                                                        aria-controls="profile" aria-selected="true">
                                                        <span class="title">Profile</span>
                                                    </a>
                                                </li>
                                                <li role="presentation">
                                                    <a href="#" class="tab-button" id="password-tab"
                                                        data-bs-toggle="tab" data-bs-target="#password" role="tab"
                                                        aria-controls="password" aria-selected="false">
                                                        <span class="title">Password</span>
                                                    </a>
                                                </li>
                                                <li role="presentation">
                                                    <a href="#" class="tab-button" id="social-tab" data-bs-toggle="tab"
                                                        data-bs-target="#social" role="tab" aria-controls="social"
                                                        aria-selected="false">
                                                        <span class="title">Social Share</span>
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>

                                        <div class="tab-content">
                                            <div class="tab-pane fade active show" id="profile" role="tabpanel"
                                                aria-labelledby="profile-tab">
                                                <div class="rbt-dashboard-content-wrapper">
                                                    <div class="tutor-bg-photo bg_image bg_image--22 height-245"></div>
                                                    <!-- Start Tutor Information  -->
                                                    <div class="rbt-tutor-information">
                                                        <div class="rbt-tutor-information-left">
                                                            <div
                                                                class="thumbnail rbt-avatars size-lg position-relative">
                                                                <img src="assets/images/team/avatar.jpg"
                                                                    alt="Instructor">
                                                                <div class="rbt-edit-photo-inner">
                                                                    <button class="rbt-edit-photo" title="Upload Photo">
                                                                        <i class="feather-camera"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="rbt-tutor-information-right">
                                                            <div class="tutor-btn">
                                                                <a class="rbt-btn btn-sm btn-border color-white radius-round-10"
                                                                    href="#">Edit Cover Photo</a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- End Tutor Information  -->
                                                </div>

                                                <div th:if="${success}"
                                                    class="alert alert-success alert-dismissible fade show"
                                                    role="alert">
                                                    <span th:text="${success}"></span>
                                                    <button type="button" class="btn-close" data-bs-dismiss="alert"
                                                        aria-label="Close"></button>
                                                </div>

                                                <!-- Start Profile Row  -->
                                                <form th:action="@{/instructor/settings}" th:object="${user}"
                                                    method="post" class="rbt-profile-row rbt-default-form row row--15">

                                                    <!-- Họ và tên -->
                                                    <div class="col-lg-6 col-md-6 col-sm-6 col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="firstname">Họ và tên</label>
                                                            <input id="firstname" type="text" th:field="*{fullname}"
                                                                required />
                                                        </div>
                                                    </div>

                                                    <!-- Email -->
                                                    <div class="col-lg-6 col-md-6 col-sm-6 col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="username">Email</label>
                                                            <input id="username" type="text" th:field="*{email}"
                                                                readonly />
                                                        </div>
                                                    </div>

                                                    <!-- Số điện thoại -->
                                                    <div class="col-lg-6 col-md-6 col-sm-6 col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="phonenumber">Số điện thoại</label>
                                                            <input id="phonenumber" type="tel" th:field="*{phoneNumber}"
                                                                required />
                                                        </div>
                                                    </div>

                                                    <!-- Kỹ năng / Công việc -->
                                                    <div class="col-lg-6 col-md-6 col-sm-6 col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="skill">Kỹ năng/Công việc</label>
                                                            <input id="skill" type="text" th:field="*{occupation}"
                                                                required />
                                                        </div>
                                                    </div>

                                                    <!-- Tiểu sử -->
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="bio">Tiểu sử</label>
                                                            <textarea id="bio" cols="20" rows="5"
                                                                th:field="*{biography}" required></textarea>
                                                        </div>
                                                    </div>

                                                    <!-- Nút cập nhật -->
                                                    <div class="col-12 mt--20">
                                                        <div class="rbt-form-group">
                                                            <button class="rbt-btn btn-gradient" type="submit">Cập nhật
                                                                thông tin</button>
                                                        </div>
                                                    </div>
                                                </form>

                                                <!-- End Profile Row  -->
                                            </div>

                                            <div class="tab-pane fade" id="password" role="tabpanel"
                                                aria-labelledby="password-tab">
                                                <!-- Start Profile Row  -->
                                                <form action="#" class="rbt-profile-row rbt-default-form row row--15">
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="currentpassword">Current Password</label>
                                                            <input id="currentpassword" type="password"
                                                                placeholder="Current Password">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="newpassword">New Password</label>
                                                            <input id="newpassword" type="password"
                                                                placeholder="New Password">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="retypenewpassword">Re-type New Password</label>
                                                            <input id="retypenewpassword" type="password"
                                                                placeholder="Re-type New Password">
                                                        </div>
                                                    </div>
                                                    <div class="col-12 mt--10">
                                                        <div class="rbt-form-group">
                                                            <a class="rbt-btn btn-gradient" href="#">Update Password</a>
                                                        </div>
                                                    </div>
                                                </form>
                                                <!-- End Profile Row  -->
                                            </div>

                                            <div class="tab-pane fade" id="social" role="tabpanel"
                                                aria-labelledby="social-tab">
                                                <!-- Start Profile Row  -->
                                                <form action="#" class="rbt-profile-row rbt-default-form row row--15">
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="facebook"><i class="feather-facebook"></i>
                                                                Facebook</label>
                                                            <input id="facebook" type="text"
                                                                placeholder="https://facebook.com/">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="twitter"><i class="feather-twitter"></i>
                                                                Twitter</label>
                                                            <input id="twitter" type="text"
                                                                placeholder="https://twitter.com/">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="linkedin"><i class="feather-linkedin"></i>
                                                                Linkedin</label>
                                                            <input id="linkedin" type="text"
                                                                placeholder="https://linkedin.com/">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="website"><i class="feather-globe"></i>
                                                                Website</label>
                                                            <input id="website" type="text"
                                                                placeholder="https://website.com/">
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="rbt-form-group">
                                                            <label for="github"><i class="feather-github"></i>
                                                                Github</label>
                                                            <input id="github" type="text"
                                                                placeholder="https://github.com/">
                                                        </div>
                                                    </div>
                                                    <div class="col-12 mt--10">
                                                        <div class="rbt-form-group">
                                                            <a class="rbt-btn btn-gradient" href="#">Update Profile</a>
                                                        </div>
                                                    </div>
                                                </form>
                                                <!-- End Profile Row  -->
                                            </div>

                                        </div>





                                    </div>
                                </div>
                                <!-- End Instructor Profile  -->

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <!-- End Card Style -->

        <div class="rbt-separator-mid">
            <div class="container">
                <hr class="rbt-separator m-0">
            </div>
        </div>
        <div class="rbt-progress-parent">
            <svg class="rbt-back-circle svg-inner" width="100%" height="100%" viewBox="-1 -1 102 102">
                <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
            </svg>
        </div>
    </div>
</body>

</html>
