<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">


<body>
    <div th:fragment="content">

        <a class="close_side_menu" href="javascript:void(0);"></a>

        <div class="rbt-page-banner-wrapper">
            <!-- Start Banner BG Image  -->
            <div class="rbt-banner-image"></div>
            <!-- End Banner BG Image  -->
        </div>

        <!-- Start Card Style -->
        <div class="rbt-dashboard-area rbt-section-overlayping-top rbt-section-gapBottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Start Dashboard Top  -->
                        <div th:replace="~{client/instructor/instructor-banner :: instructor-banner}"
                            sec:authorize="hasRole('ROLE_INSTRUCTOR')"></div>
                        <div th:replace="~{client/student/student-banner :: student-banner}"
                            sec:authorize="hasRole('ROLE_STUDENT') and not hasRole('ROLE_INSTRUCTOR')"></div>
                        <!-- End Dashboard Top  -->

                        <div class="row g-5">
                            <div class="col-lg-3">
                                <!-- Start Dashboard Sidebar  -->
                                <div th:replace="~{client/student/studentSidebar :: student-sidebar}"></div>
                                <!-- End Dashboard Sidebar  -->
                            </div>

                            <div class="col-lg-9">
                                <!-- Start Enrole Course  -->
                                <div class="rbt-dashboard-content bg-color-white rbt-shadow-box">
                                    <div class="content">

                                        <div class="section-title">
                                            <h4 class="rbt-title-style-3">Khóa học của tôi
                                            </h4>
                                        </div>

                                        <div class="advance-tab-button mb--30">
                                            <ul class="nav nav-tabs tab-button-style-2 justify-content-start"
                                                id="myTab-4" role="tablist">
                                                <li role="presentation">
                                                    <a href="#" class="tab-button active" id="publish-tab-4"
                                                        data-bs-toggle="tab" data-bs-target="#publish-4" role="tab"
                                                        aria-controls="publish-4" aria-selected="true">
                                                        <span class="title">Đã đăng</span>
                                                    </a>
                                                </li>
                                                <li role="presentation">
                                                    <a href="#" class="tab-button" id="pending-tab-4"
                                                        data-bs-toggle="tab" data-bs-target="#pending-4" role="tab"
                                                        aria-controls="pending-4" aria-selected="false">
                                                        <span class="title">Đang chờ phê duyệt</span>
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>

                                        <div class="tab-content">
                                            <div class="tab-pane fade active show" id="publish-4" role="tabpanel"
                                                aria-labelledby="publish-tab-4">
                                                <div class="row g-5">
                                                    <!-- Lặp qua danh sách khóa học đã approved -->
                                                    <div class="col-lg-4 col-md-6 col-12"
                                                        th:each="course : ${approvedCourses}">
                                                        <div class="rbt-card variation-01 rbt-hover">
                                                            <!-- Ảnh khóa học -->
                                                            <div class="rbt-card-img">
                                                                <a th:href="@{'/detail/' + ${course.courseId}}">
                                                                    <img th:src="@{${course.courseImage}}"
                                                                        alt="Course image">
                                                                </a>
                                                            </div>

                                                            <!-- Thông tin chi tiết khóa học -->
                                                            <div class="rbt-card-body">
                                                                <div class="rbt-card-top">
                                                                    <div class="rbt-review">
                                                                        <div class="rating">
                                                                            <!-- Hiển thị sao vàng theo số nguyên -->
                                                                            <i class="fas fa-star"
                                                                                th:each="star : ${#numbers.sequence(1, T(java.lang.Math).floor(course.rating))}"></i>

                                                                            <!-- Nếu muốn có sao rỗng cho đủ 5 -->
                                                                            <i class="far fa-star"
                                                                                th:each="star : ${#numbers.sequence(1, 5 - T(java.lang.Math).floor(course.rating))}"></i>
                                                                        </div>
                                                                        <!-- Số lượng đánh giá -->
                                                                        <span class="rating-count"
                                                                            th:text="'(' + ${course.reviewCount} + ' Reviews)'">
                                                                            (0 Reviews)
                                                                        </span>
                                                                    </div>

                                                                    <!-- Nút bookmark -->
                                                                    <div class="rbt-bookmark-btn">
                                                                        <a class="rbt-round-btn" title="Bookmark"
                                                                            href="#">
                                                                            <i class="feather-bookmark"></i>
                                                                        </a>
                                                                    </div>
                                                                </div>

                                                                <!-- Tiêu đề khóa học -->
                                                                <h4 class="rbt-card-title">
                                                                    <a th:href="@{'/detail/' + ${course.courseId}}"
                                                                        th:text="${course.title}">
                                                                        Course Title
                                                                    </a>
                                                                </h4>

                                                                <!-- Thông tin thêm về khóa học -->
                                                                <ul class="rbt-meta">
                                                                    <li>
                                                                        <i class="feather-book"></i>
                                                                        <span
                                                                            th:text="${course.modules.size()} + ' Lessons'">0
                                                                            Lessons</span>
                                                                    </li>
                                                                    <li>
                                                                        <i class="feather-users"></i>
                                                                        <span
                                                                            th:text="${course.enrollments.size()} + ' Students'">0
                                                                            Students</span>
                                                                    </li>
                                                                </ul>

                                                                <!-- Phần giá -->
                                                                <div class="rbt-card-bottom">
                                                                    <div class="rbt-price">
                                                                        <!-- Hiển thị giá hiện tại -->
                                                                        <span class="current-price"
                                                                            th:style="'font-size: 2.2rem;'"
                                                                            th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                                                        </span>

                                                                        <!-- Hiển thị giá gốc nếu có giảm giá -->
                                                                        <span class="off-price"
                                                                            th:if="${course.discount > 0}"
                                                                            th:style="'font-size: 1.4rem; text-decoration: line-through; color: #999;'"
                                                                            th:text="${#numbers.formatDecimal(course.price / (1 - (course.discount / 100)), 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                                                        </span>
                                                                    </div>

                                                                    <!-- Nút sửa khóa học -->
                                                                    <a class="rbt-btn-link left-icon"
                                                                        th:href="@{'/instructor/course/edit/' + ${course.courseId}}">
                                                                        <i class="feather-edit"></i> Edit
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                </div>
                                            </div>

                                            <div class="tab-pane fade" id="pending-4" role="tabpanel"
                                                aria-labelledby="pending-tab-4">
                                                <div class="row g-5">
                                                    <!-- Start Single Course -->
                                                    <div class="col-lg-4 col-md-6 col-12"
                                                        th:each="course : ${pendingCourses}">
                                                        <div class="rbt-card variation-01 rbt-hover">
                                                            <div class="rbt-card-img">
                                                                <a th:href="@{'/detail/' + ${course.courseId}}">
                                                                    <img th:src="@{${course.courseImage}}"
                                                                        alt="Card image">
                                                                </a>
                                                            </div>
                                                            <div class="rbt-card-body">
                                                                <div class="rbt-card-top">
                                                                    <!-- <div class="rbt-review">
                                                                        <div class="rating">
                                                                            <i class="fas fa-star"></i>
                                                                            <i class="fas fa-star"></i>
                                                                            <i class="fas fa-star"></i>
                                                                            <i class="fas fa-star"></i>
                                                                            <i class="fas fa-star"></i>
                                                                        </div>
                                                                        <span class="rating-count"> (3 Reviews)</span> -->
                                                                    <!-- giữ nguyên -->
                                                                    <!-- </div>
                                                                    <div class="rbt-bookmark-btn">
                                                                        <a class="rbt-round-btn" title="Bookmark"
                                                                            href="#">
                                                                            <i class="feather-bookmark"></i>
                                                                        </a>
                                                                    </div> -->
                                                                </div>
                                                                <h4 class="rbt-card-title">
                                                                    <a th:href="@{'/detail/' + ${course.courseId}}"
                                                                        th:text="${course.title}">Course Title</a>
                                                                </h4>
                                                                <ul class="rbt-meta">
                                                                    <li><i class="feather-book"></i>20 Lessons</li>
                                                                    <!-- giữ nguyên -->
                                                                    <!-- <li><i class="feather-users"></i>30 Students</li> -->
                                                                    <!-- giữ nguyên -->
                                                                </ul>

                                                                <div class="rbt-card-bottom">
                                                                    <div class="rbt-price">
                                                                        <span class="current-price"
                                                                            th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                                                            style="font-size: 2.2rem;">
                                                                        </span>
                                                                        <span class="off-price"
                                                                            th:if="${course.discount > 0}"
                                                                            th:text="${#numbers.formatDecimal(course.price / (1 - (course.discount / 100)), 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                                                            style="font-size: 1.2rem; text-decoration: line-through; color: #999;">
                                                                        </span>
                                                                    </div>
                                                                    <a class="rbt-btn-link left-icon"
                                                                        th:href="@{'/instructor/course/edit/' + ${course.courseId}}">
                                                                        <i class="feather-edit"></i> Edit
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <!-- End Single Course -->
                                                </div>

                                            </div>
                                        </div>

                                    </div>
                                </div>
                                <!-- End Enrole Course  -->
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <!-- End Card Style -->

        <div class="rbt-separator-mid">
            <div class="container">
                <hr class="rbt-separator m-0">
            </div>
        </div>
        <div class="rbt-progress-parent">
            <svg class="rbt-back-circle svg-inner" width="100%" height="100%" viewBox="-1 -1 102 102">
                <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
            </svg>
        </div>
    </div>
</body>

</html>
