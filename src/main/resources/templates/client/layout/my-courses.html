<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <my-courses th:fragment="my-courses">
            <div class="container">
                <h1>My Courses</h1>
                <p>Welcome to your courses page!</p>
                <ul>
                    <li th:each="course : ${courses}" th:text="${course.name}">Course Name</li>
                </ul>
            </div>
    </body>
</html>
