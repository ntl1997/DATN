<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div id="main" th:fragment="content">
      <header class="mb-3">
        <a href="#" class="burger-btn d-block d-xl-none">
          <i class="bi bi-justify fs-3"></i>
        </a>
      </header>

      <div class="page-heading">
        <div class="page-title">
          <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
              <h3>Tạo lớp học</h3>
            </div>
            <div class="col-12 col-md-6 order-md-2 order-first">
              <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Tổng quan</a></li>
                  <li class="breadcrumb-item"><a th:href="@{/admin/course-offerings}">Quản lý lớp học</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Tạo lớp học</li>
                </ol>
              </nav>
            </div>
          </div>
        </div>

        <!-- Basic Vertical form layout section start -->
        <section id="basic-vertical-layouts">
          <div class="row match-height">
            <div class="col-md-6 col-12">
              <div class="card">
                <div class="card-header">
                  <h4 class="card-title">Horizontal Form with Icons</h4>
                </div>
                <div class="card-content">
                  <div class="card-body">
                    <form
                      class="form form-horizontal"
                      th:object="${courseOffering}"
                      th:action="@{/admin/course-offering/create}"
                      method="post"
                    >
                      <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
                        <i class="bi bi-file-excel"></i> Hãy nhập đầy đủ thông tin!
                      </div>

                      <div class="form-body">
                        <div class="row">
                          <div class="col-md-4">
                            <label>Chọn khóa học</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <select class="form-select" id="basicSelect" th:field="*{course.courseId}">
                                  <option th:value="0">-- Chọn khóa học --</option>
                                  <option
                                    th:each="course : ${courses}"
                                    th:value="${course.courseId}"
                                    th:text="${course.title}"
                                  ></option>
                                </select>
                              </div>
                            </div>
                          </div>

                          <div class="col-md-4">
                            <label>Kỳ học</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <input type="text" class="form-control" th:field="*{semester}" />
                              </div>
                            </div>
                          </div>

                          <div class="col-md-4">
                            <label>Tên lớp</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <input type="text" class="form-control" th:field="*{className}" />
                              </div>
                            </div>
                          </div>

                          <div class="col-md-4">
                            <label>Giảng viên phụ trách</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <select class="form-select" id="basicSelect" th:field="*{instructor.id}">
                                  <option th:value="0">-- Chọn giảng viên phụ trách --</option>
                                  <option
                                    th:each="instructor : ${instructors}"
                                    th:value="${instructor.id}"
                                    th:text="${instructor.fullname}"
                                  ></option>
                                </select>
                              </div>
                            </div>
                          </div>

                          <div class="col-md-4">
                            <label>Ngày bắt đầu</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <input type="date" class="form-control" th:field="*{startDate}" />
                              </div>
                            </div>
                          </div>

                          <div class="col-md-4">
                            <label>Ngày kết thúc</label>
                          </div>
                          <div class="col-md-8">
                            <div class="form-group">
                              <div class="position-relative">
                                <input type="date" class="form-control" th:field="*{endDate}" />
                              </div>
                            </div>
                          </div>

                          <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary me-1 mb-1">Submit</button>
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <!-- // Basic Vertical form layout section end -->
      </div>
    </div>
  </body>
</html>
