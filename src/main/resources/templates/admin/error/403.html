<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">403 - Mazer Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{../admin-assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{../admin-assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{../admin-assets/css/app.css}">
    <link rel="stylesheet" th:href="@{../admin-assets/css/pages/error.css}">
</head>

<body>
    <div id="error">


        <div class="error-page container">
            <div class="col-md-8 col-12 offset-md-2">
                <img class="img-error" th:src="@{../admin-assets/images/samples/error-403.png}" alt="Not Found">
                <div class="text-center">
                    <h1 class="error-title">403 - Forbidden</h1>
                    <p class="fs-5 text-gray-600">Bạn không có quyền truy cập trang này.</p>
                    <a th:href="@{/admin/login}" class="btn btn-lg btn-outline-primary mt-3">Quay lại</a>
                </div>
            </div>
        </div>


    </div>
</body>

</html>
