<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div id="main" th:fragment="content">
        <div class="page-heading">
            <div class="page-title">
                <div class="row">
                    <div class="col-12 col-md-6 order-md-1 order-last">
                        <h3>Danh sách các giảng viên được học
                            nhiều nhất</h3>
                    </div>
                    <div class="col-12 col-md-6 order-md-2 order-first">
                        <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Tổng quan</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Danh sách các giảng viên được học
                                    nhiều nhất</li>
                            </ol>
                        </nav>
                    </div>
                </div>
            </div>
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped" id="table1">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Họ và tên</th>
                                    <th>Avatar</th>
                                    <th>SĐT</th>
                                    <th>Số lượng học sinh</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="instructor, stat : ${topInstructors}">
                                    <td th:text="${stat.index + 1}">1</td>
                                    <td th:text="${instructor['ten']}">Tên giảng viên</td>
                                    <td>
                                        <img th:src="@{${instructor['avatar']}}" alt="Avatar"
                                            style="width: 50px; height: 50px; border-radius: 50%;" />
                                    </td>
                                    <td th:text="${instructor['sdt']}">SĐT</td>
                                    <td th:text="${instructor[stcount]}">Số lượng học sinh</td>
                                </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <th:block th:fragment="scripts">
        <script>
            // Simple Datatable
            let dataTable = new simpleDatatables.DataTable(table1, {
                perPage: 5,
                perPageSelect: false // Tắt dropdown chọn số entries
            });
        </script>
    </th:block>
</body>

</html>
