<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div id="main" th:fragment="content">
        <div class="page-heading">
            <div class="page-title">
                <div class="row">
                    <div class="col-12 col-md-6 order-md-1 order-last">
                        <h3>Danh sách các khóa học được học
                            nhiều nhất</h3>
                    </div>
                    <div class="col-12 col-md-6 order-md-2 order-first">
                        <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Tổng quan</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Danh sách các khóa học được học
                                    nhiều nhất</li>
                            </ol>
                        </nav>
                    </div>
                </div>
            </div>
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped" id="table1">
                            <thead>
                                <tr>
                                    <th>STT</th>
                                    <th>Tên khóa học</th>
                                    <th>Email</th>
                                    <th>SĐT</th>
                                    <th>Chức vụ</th>
                                    <th>Vai trò</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user, stat : ${users}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${user.fullname}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.phoneNumber}"></td>
                                    <td th:text="${user.occupation}"></td>
                                    <td>
                                        <span th:each="role : ${user.roles}" th:text="${role.roleName}"></span>
                                    </td>
                                    <td>
                                        <span class="badge bg-success" th:if="${user.status == 'Active'}">Active</span>
                                        <span class="badge bg-danger"
                                            th:if="${user.status == 'Inactive'}">Inactive</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <th:block th:fragment="scripts">
        <script>
            // Simple Datatable
            let table1 = document.querySelector("#table1");
            let dataTable = new simpleDatatables.DataTable(table1, {
                perPage: 5
            });
        </script>
    </th:block>
</body>

</html>
