<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div id="main" th:fragment="content">
        <header class="mb-3">
            <a href="#" class="burger-btn d-block d-xl-none">
                <i class="bi bi-justify fs-3"></i>
            </a>
        </header>  
        <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>DataTable</h3>
                            <p class="text-subtitle text-muted">For user to check they list</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">DataTable</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section class="section">
                    <div class="card">
                        <div class="card-header">
                            Simple Datatable
                        </div>
                        <div class="card-body">
                            <table class="table table-striped" id="table1">
                                <thead>
                                    <tr>
                                        <th>Mã Khoá Học</th>
                                        <th>Tên Khóa Học</th>
                                        <th>Giảng Viên</th>
                                        <th>Trạng Thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="course : ${courses}">
                                        <td th:text="${course.courseId}"></td>
                                        <td th:text="${course.title}"></td>
                                        <td th:text="${course.createdBy != null ? course.createdBy.fullname : 'N/A'}"></td>
                                        <td>
                                            <span th:classappend="'badge bg-' + (${course.status} == 'active' ? 'success' : 'warning')" 
                                                th:text="${course.status}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </section>
            </div>
    
    </div>

    <!-- <th:block th:fragment="styles">
        <style th:src="@{/admin-assets/css/app-email.css}"></style>
    </th:block>

    <th:block th:fragment="scripts">
        <script th:src="@{/admin-assets/js/app-email.js}"></script>
    </th:block> -->
</body>

</html>
